name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # create the release
  packages: write   # push to ghcr

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # One manifest list covering both architectures, so a consumer's kubelet
      # picks the right .so with no arch in their YAML.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  # Also publish the bare .so per architecture, for anyone who would rather use
  # dynamicModules' source.remote (url + sha256) than mount an image.
  assets:
    runs-on: ubuntu-latest
    container: ghcr.io/rust-cross/cargo-zigbuild:0.23.3   # see ci.yml
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            asset: libaws-ppv2-identity-aarch64.so
          - target: x86_64-unknown-linux-gnu
            asset: libaws-ppv2-identity-x86_64.so
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y clang
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - run: |
          cp target/${{ matrix.target }}/release/libaws_ppv2_identity.so ${{ matrix.asset }}
          sha256sum ${{ matrix.asset }} | tee ${{ matrix.asset }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
