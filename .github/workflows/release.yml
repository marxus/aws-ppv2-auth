# Publishes ONE artifact: the multi-arch image. There was also a job emitting
# the bare .so per architecture as release assets, for a consumer that would
# rather use dynamicModules' source.remote than mount an image. No such consumer
# exists, and it meant building the same .so six times per tag -- twice here,
# twice in the image, twice already in ci. Bring it back the day someone needs
# a URL instead of a manifest list.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write   # push to ghcr

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # NOTE the published tags drop the leading v: git tag v0.3.0 publishes
          # image tag 0.3.0. Reference `:0.3.0` in your manifests, not `:v0.3.0`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # One manifest list covering both architectures, so a consumer's kubelet
      # picks the right .so with no arch in their YAML.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
