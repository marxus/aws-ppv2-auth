name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

# A second push supersedes the first, so let the first one go rather than
# running two full matrices to learn about a commit nobody is waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      # No clang install: bindgen parses Envoy's abi.h and needs libclang, which
      # the runner image already has. Same for the cross job -- see below.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  # The .so is what ships, so prove both architectures link on every PR rather
  # than finding out at release time.
  cross:
    runs-on: ubuntu-latest
    # Build in the exact image the Dockerfile builds with, so CI cannot drift
    # from what ships. It already carries zig, cargo-zigbuild and both target
    # std libs, which also removes the dependency on zig's download mirrors --
    # setup-zig@v1 resolving "latest" is what broke the first release.
    #
    # No clang install either: the image ships libclang-19, and bindgen wants
    # the library rather than the `clang` binary. Verified by building in it
    # with nothing added.
    container: ghcr.io/rust-cross/cargo-zigbuild:0.23.3
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: exported hooks are present
        run: |
          set -eu
          so=target/${{ matrix.target }}/release/libaws_ppv2_auth.so
          test -f "$so"
          # Envoy resolves the ENTIRE hook set when building a filter config, so a
          # missing symbol is a startup failure, not a runtime one. Assert them.
          for sym in \
            envoy_dynamic_module_on_program_init \
            envoy_dynamic_module_on_listener_filter_config_new \
            envoy_dynamic_module_on_listener_filter_on_data \
            envoy_dynamic_module_on_udp_listener_filter_config_new \
            envoy_dynamic_module_on_udp_listener_filter_on_data ; do
            nm -D --defined-only "$so" | grep -q " $sym$" \
              || { echo "missing exported hook: $sym" >&2; exit 1; }
          done
          echo "size: $(stat -c%s "$so") bytes"
