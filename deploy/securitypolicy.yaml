# What consumes the synthesized address. This is ordinary Envoy Gateway
# authorization -- the module's whole point is that no custom matcher is needed.
#
# The SAME rules work on an HTTPRoute and a TCPRoute, because the module rewrites
# the connection's source address before any RBAC filter runs. clientCIDRs is the
# only principal a TCPRoute supports, so L4 tenant identity is not otherwise
# expressible at all.
#
# Reproduce any tenant address with:
#   printf %s vpce-0123456789abcdef0 | sha256sum | cut -c1-16
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: echo-authz
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: echo
  authorization:
    defaultAction: Deny
    rules:
      # A specific PrivateLink tenant. The vpce-id does NOT survive endpoint
      # recreation, and a replaced endpoint then gets 403 with no other symptom.
      - name: tenant-a
        action: Allow
        principal:
          clientCIDRs: [fd00:dead:beef:1:7b53:e75b:a00:11c/128]

      # Coarse rules the kind nibble gives you for free.
      - name: any-privatelink-tenant
        action: Allow
        principal:
          clientCIDRs: [fd00:dead:beef:1::/64]

      # An IPv4 CIDR maps mechanically onto /(96+N): 10.1.0.0/16 -> :4::a01:0/112
      - name: edge-tier-ipv4
        action: Allow
        principal:
          clientCIDRs: [fd00:dead:beef:4::a01:0/112]

      # IPv6 clients keep their real addresses, so write ordinary CIDRs.
      - name: known-ipv6-range
        action: Allow
        principal:
          clientCIDRs: [2001:db8:10da:7800::/56]
