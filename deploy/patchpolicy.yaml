# Attaching the module to listeners.
#
# Envoy Gateway has no CRD for listener filters, so this is raw xDS via
# EnvoyPatchPolicy. Requires `enableEnvoyPatchPolicy: true` in the Envoy Gateway
# Helm values; it is off by default.
#
# SEVERAL POLICIES MAY TARGET ONE GATEWAY -- verified on EG v1.9.1, all Accepted.
# They apply in policy-NAME order, which is how the filter order below is fixed:
# a policy sorting later inserts at index 0 and pushes earlier ones right.
#
# The chain shapes, and why they differ:
#
#   tcp  -> [ppv2_auth, ...]
#   udp  -> [ppv2_auth, ...]
#   tls  -> [ppv2, tls_inspector, auth, ...]
#
# The filter_name is the position: `ppv2_auth` is the whole job in one filter,
# `ppv2` labels only, `auth` reads that label and scopes it. Each takes exactly
# one config shape, so a misplaced filter fails its listener rather than
# half-working.
#
# TLS is the special case. `auth` needs the SNI, which only exists after
# tls_inspector has run, and tls_inspector cannot find a ClientHello until the
# PROXY header is drained -- so `ppv2` splits off to the front to drain it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  # Sorts before any tenant policy, so this base applies first and the `scopes`
  # array exists for them to append to.
  name: aws-ppv2-auth-base
  namespace: envoy-gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gw
  type: JSONPatch
  jsonPatches:
    # --- TLS listener: [ppv2, tls_inspector, auth] ---------------------------
    #
    # Do NOT also enable Envoy's own proxy_protocol filter on this listener
    # (ClientTrafficPolicy.enableProxyProtocol). Only one of the two can drain
    # the header.
    #
    # Added third, so it ends up last. No `ula`: `ppv2` already put the
    # synthesized identity on the socket and this reads it back.
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: envoy-gateway-system/gw/https
      operation:
        op: add
        path: /listener_filters/0
        value:
          name: aws-ppv2-auth.auth
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.dynamic_modules.v3.DynamicModuleListenerFilter
            dynamic_module_config: { name: aws-ppv2-auth }
            filter_name: auth
            filter_config:
              # Struct, not StringValue: Envoy serializes it to JSON for the
              # module, and a structured config is what lets a separate CR append
              # a scope with JSON Patch. See the tenant example at the bottom.
              "@type": type.googleapis.com/google.protobuf.Struct
              value:
                # `scopes: []` must be present even when empty, or `/scopes/-`
                # has nothing to append to. Empty means SNI mode with nothing
                # claimed, which denies everything -- the right starting state.
                #
                # A scope may name several hostnames sharing one list. Quote any
                # pattern starting with `*`: YAML reads it as an alias otherwise.
                scopes:
                  - sni:
                      - l7.mgmt.test
                      - "*.pass.mgmt.test"
                    allow:
                      - fd00:dead:beef:1:7b53:e75b:6e3d:cfdb/128
                  - sni:
                      - tcp.mgmt.test
                    allow:
                      - fd00:dead:beef:4::a01:0/112
                      - fd00:dead:beef:1:7b53:e75b:6e3d:cfdb/128

    # Added second, ends up in the middle. Without this the SNI is always empty
    # and every connection is denied -- fail-closed, but look here first if so.
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: envoy-gateway-system/gw/https
      operation:
        op: add
        path: /listener_filters/0
        value:
          name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector

    # Added last, ends up first: drain the header before tls_inspector looks.
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: envoy-gateway-system/gw/https
      operation:
        op: add
        path: /listener_filters/0
        value:
          name: aws-ppv2-auth.ppv2
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.dynamic_modules.v3.DynamicModuleListenerFilter
            dynamic_module_config: { name: aws-ppv2-auth }
            filter_name: ppv2
            filter_config:
              "@type": type.googleapis.com/google.protobuf.Struct
              value:
                # Generate your own /48 once, per RFC 4193: fd + 40 random bits.
                # `ppv2` never enforces, so it takes `ula` and nothing else.
                ula: fd00:dead:beef::/48

    # --- UDP listener: [ppv2_auth] ------------------------------------------------
    #
    # No way to hand an identity between UDP filters -- the ABI has no filter
    # state and no set_remote_address -- so it is `ppv2_auth`, the whole job in
    # one. Same shape a plain TCP listener uses; the name says so.
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: envoy-gateway-system/gw/dns
      operation:
        op: add
        path: /listener_filters/0
        value:
          name: aws-ppv2-auth.ppv2_auth
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.udp.dynamic_modules.v3.DynamicModuleUdpListenerFilter
            dynamic_module_config: { name: aws-ppv2-auth }
            filter_name: ppv2_auth
            filter_config:
              "@type": type.googleapis.com/google.protobuf.Struct
              value:
                ula: fd00:dead:beef::/48
                allow:
                  - fd00:dead:beef:1:7b53:e75b:6e3d:cfdb/128

---
# A tenant contributing its own scope, from its own CR.
#
# `-` appends to the array. Because every scope lands in ONE filter, precedence
# still holds across CRs: an exact name here still beats a `*.` wildcard declared
# in the base. Chaining separate auth filters could not do that -- whichever
# filter ran first would claim the name and judge it against the wrong list.
#
# The name must sort AFTER the base, or this applies to a filter that does not
# exist yet and the policy reports the failure in its status.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: aws-ppv2-auth-tenant-a
  namespace: envoy-gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gw
  type: JSONPatch
  jsonPatches:
    # /listener_filters/2 is positional: [ppv2, tls_inspector, auth]. A new policy
    # inserting at index 0 would shift it -- it would then land on tls_inspector,
    # which has no such path, and fail loudly rather than silently.
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: envoy-gateway-system/gw/https
      operation:
        op: add
        path: /listener_filters/2/typed_config/filter_config/value/scopes/-
        value:
          sni:
            - tenant-a.mgmt.test
          allow:
            - fd00:dead:beef:1:7b53:e75b:6e3d:cfdb/128
