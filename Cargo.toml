[package]
name = "aws-ppv2-identity"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Envoy dynamic module: AWS PROXY protocol v2 identity as a matchable IPv6 address"
repository = "https://github.com/marxus/aws-ppv2-identity"

[dependencies]
# PINNED TO THE ENVOY THIS RUNS IN. Bump it in the same commit as the Envoy
# image; bindgen regenerates the ABI from that tag, so a mismatch is a build
# error. Envoy only WARNS on a runtime ABI mismatch, so this pin is the guard.
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", tag = "v1.39.1" }
sha2 = { version = "0.10", features = ["asm"] }
# filter_config arrives as JSON: Envoy serializes a google.protobuf.Struct to JSON
# before handing it to the module (MessageUtil::knownAnyToBytes, utility.h:460).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
# Built as libaws_ppv2_identity.so, renamed to libaws-ppv2-identity.so: Envoy
# loads lib<name>.so and EG's module-name pattern forbids Rust's underscore.
name = "aws_ppv2_identity"
crate-type = ["cdylib", "rlib"]

# Tuned for runtime, not size. These three are already the maximum the profile
# knobs offer.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# LTO inlines our functions into the exported hooks, so they exist as no symbol
# at all -- DWARF is the only thing that can attribute a profile back to them.
# Costs nothing at runtime: debug info is never mapped.
strip = false
debug = 1   # line tables only

# MUST stay "unwind": the SDK's catch_unwind cannot run under "abort", and one
# bad header would kill the whole Envoy process instead of one connection.
panic = "unwind"

# Dependencies carry no debug info: 24MB with, 5MB without, and nobody profiles
# into sha2 looking for our regressions.
[profile.release.package."*"]
debug = 0
